<div id="current-sponsors-container">
		<a name="current"></a>
		<h3>Thanks to our Current Sponsors</h3>
		<div id="current-sponsors-list">
				<table  class="sponsor-table">
				{% for sponsor in page.sponsors_table %}
						<tr class="sponsor-row"><td class="sponsor-cell">{{ sponsor.column1 }}</td><td class="sponsor-cell">{{ sponsor.column2 }}</td><td class="sponsor-cell">{{ sponsor.column3 }}</td></tr>
				{% endfor %}
				</table>
		</div>
</div>
